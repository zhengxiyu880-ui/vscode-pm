name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 零依赖：不需要 npm install，直接测代码本身
        node: ['18', '20', '22', '24']

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}

      - name: 语法检查
        run: npm run check

      - name: 接口 + 前端渲染测试
        run: npm test
        env:
          NO_COLOR: '1'
