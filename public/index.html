<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>项目管理系统</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%234f9cf9'/%3E%3Cpath d='M9 22V10h4.2c3 0 4.8 2.2 4.8 6s-1.8 6-4.8 6H9Zm2.6-2.2h1.4c1.5 0 2.3-1.3 2.3-3.8s-.8-3.8-2.3-3.8h-1.4v7.6Z' fill='%23fff'/%3E%3C/svg%3E">
<link rel="stylesheet" href="/styles.css">
</head>
<body>
<div class="app">
  <header class="titlebar">
    <div class="brand">
      <span class="brand-mark" aria-hidden="true"></span>
      <span class="brand-name">项目管理系统</span>
    </div>

    <div class="search">
      <svg viewBox="0 0 16 16" width="14" height="14" aria-hidden="true"><path d="M10.6 9.5a4.5 4.5 0 1 1 1-1l3 3-1 1-3-3Zm-3.1.5a3 3 0 1 0 0-6 3 3 0 0 0 0 6Z" fill="currentColor"/></svg>
      <input id="search" type="search" placeholder="搜索任务标题、描述或标签…" autocomplete="off" spellcheck="false">
      <kbd>/</kbd>
    </div>

    <div class="actions">
      <button id="btn-new-project" class="btn ghost" type="button">＋ 项目</button>
      <button id="btn-new-task" class="btn primary" type="button">＋ 任务</button>
      <button id="btn-theme" class="icon-btn" type="button" title="切换明暗主题" aria-label="切换明暗主题">
        <svg class="icon-sun" viewBox="0 0 16 16" width="15" height="15" aria-hidden="true"><path d="M8 11.5A3.5 3.5 0 1 1 8 4.5a3.5 3.5 0 0 1 0 7Zm0-1.2a2.3 2.3 0 1 0 0-4.6 2.3 2.3 0 0 0 0 4.6ZM8 0h1v2.2H8V0Zm0 13.8h1V16H8v-2.2ZM16 7.5v1h-2.2v-1H16Zm-13.8 0v1H0v-1h2.2Zm11.1-5.6.7.7-1.5 1.5-.7-.7 1.5-1.5ZM3.9 11.3l.7.7-1.5 1.5-.7-.7 1.5-1.5Zm9 0 1.5 1.5-.7.7-1.5-1.5.7-.7ZM3.2 1.9l1.5 1.5-.7.7-1.5-1.5.7-.7Z" fill="currentColor"/></svg>
        <svg class="icon-moon" viewBox="0 0 16 16" width="15" height="15" aria-hidden="true"><path d="M9.6 1.6a6.6 6.6 0 1 0 4.8 11.2A5.6 5.6 0 0 1 9.6 1.6Z" fill="currentColor"/></svg>
      </button>
    </div>
  </header>

  <div class="body">
    <aside class="sidebar">
      <div class="sidebar-head">
        <span>项目</span>
        <span id="project-total" class="count">0</span>
      </div>
      <nav id="project-list" class="project-list" aria-label="项目列表"></nav>
      <div class="sidebar-foot">
        <button id="btn-export" class="link-btn" type="button">导出数据</button>
        <span class="dot-sep">·</span>
        <button id="btn-import" class="link-btn" type="button">导入数据</button>
      </div>
    </aside>

    <main class="main">
      <div class="toolbar">
        <div class="tabs" role="tablist">
          <button class="tab is-active" data-view="board" role="tab" type="button">看板</button>
          <button class="tab" data-view="list" role="tab" type="button">列表</button>
          <button class="tab" data-view="overview" role="tab" type="button">概览</button>
        </div>
        <div class="filters">
          <select id="filter-priority" class="select" title="按优先级筛选">
            <option value="all">全部优先级</option>
            <option value="high">高</option>
            <option value="medium">中</option>
            <option value="low">低</option>
          </select>
          <select id="filter-sort" class="select" title="排序方式">
            <option value="manual">手动排序</option>
            <option value="due">按截止日期</option>
            <option value="priority">按优先级</option>
            <option value="created">按创建时间</option>
          </select>
          <button id="btn-clear" class="btn ghost sm" type="button" hidden>清除筛选</button>
        </div>
      </div>
      <section id="view" class="view"></section>
    </main>
  </div>
</div>

<div id="modal-root"></div>
<div id="toast-root" class="toast-root" aria-live="polite"></div>
<input id="file-input" type="file" accept="application/json,.json" hidden>

<script src="/app.js"></script>
</body>
</html>
